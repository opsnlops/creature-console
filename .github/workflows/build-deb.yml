name: Build Debian Packages

on:
  push:
    branches:
      # "**" and not "*": a single star doesn't cross "/", which silently skipped
      # every feature/<n>-name branch this repo actually uses.
      - "**"

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            container: debian:trixie-slim
          - arch: arm64
            runner: ubuntu-24.04-arm
            container: debian:trixie-slim
    env:
      SWIFT_VERSION: "6.3.3"


    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates pkg-config clang \
            libicu-dev libxml2-dev libbsd-dev libcurl4-openssl-dev \
            libssl-dev libsqlite3-dev libzstd-dev libedit-dev zlib1g-dev \
            git cmake ninja-build python3 tar xz-utils build-essential \
            debhelper devscripts fakeroot

      - name: Install Swift via Swiftly
        run: |
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf swiftly-$(uname -m).tar.gz
          ./swiftly init --quiet-shell-followup
          source "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          swiftly install "${SWIFT_VERSION}"
          swift --version

      - name: Build Debian package
        run: |
          source "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          export DEB_BUILD_OPTIONS=nocheck
          SWIFT_BUILD_FLAGS="-c release --product creature-cli --static-swift-stdlib" \
          SWIFT_BUILD_FLAGS_MQTT="-c release --product creature-mqtt --static-swift-stdlib" \
          SWIFT_BUILD_FLAGS_WORLD="-c release --product creature-world --static-swift-stdlib" \
          SWIFT_BUILD_FLAGS_COMMUNICATOR_GATEWAY="-c release --product creature-communicator-gateway --static-swift-stdlib" \
            dpkg-buildpackage -us -uc -b

      - name: Collect deb artifacts
        run: |
          mkdir -p artifacts
          mv ../creature-cli_*_${{ matrix.arch }}.deb artifacts/
          mv ../creature-mqtt_*_${{ matrix.arch }}.deb artifacts/
          mv ../creature-agent_*_${{ matrix.arch }}.deb artifacts/
          mv ../creature-world_*_${{ matrix.arch }}.deb artifacts/
          mv ../creature-communicator-gateway_*_${{ matrix.arch }}.deb artifacts/
          mv ../creature-cli-dbgsym_*_${{ matrix.arch }}.ddeb artifacts/
          mv ../creature-mqtt-dbgsym_*_${{ matrix.arch }}.ddeb artifacts/
          mv ../creature-agent-dbgsym_*_${{ matrix.arch }}.ddeb artifacts/
          mv ../creature-world-dbgsym_*_${{ matrix.arch }}.ddeb artifacts/
          mv ../creature-communicator-gateway-dbgsym_*_${{ matrix.arch }}.ddeb artifacts/

      - name: Inspect creature-world package
        run: |
          package="$(find artifacts -name 'creature-world_*_${{ matrix.arch }}.deb' -print -quit)"
          test -n "${package}"
          dpkg-deb --info "${package}"
          dpkg-deb --contents "${package}"
          dpkg-deb --contents "${package}" | grep -Eq ' ./bin/creature-world$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./etc/creature/world.json$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./usr/lib/systemd/system/creature-world.service$'

      - name: Smoke-test creature-world package in Debian Trixie
        run: |
          docker run --rm \
            --env DEBIAN_FRONTEND=noninteractive \
            --volume "${PWD}/artifacts:/artifacts:ro" \
            debian:trixie-slim \
            bash -euxc '
              apt-get update
              apt-get install -y /artifacts/creature-world_*_$(dpkg --print-architecture).deb
              test "$(stat -c %U:%G /bin/creature-world)" = root:root
              test "$(stat -c %a /bin/creature-world)" = 755
              test -f /etc/creature/world.json
              test -f /usr/lib/systemd/system/creature-world.service
              grep -Fx "ExecStart=/bin/creature-world --config /etc/creature/world.json" /usr/lib/systemd/system/creature-world.service
              grep -Fx "DynamicUser=yes" /usr/lib/systemd/system/creature-world.service
              /bin/creature-world --version
              /bin/creature-world --help >/dev/null
              test "$(dpkg-query -W creature-world | cut -f2)" = "$(/bin/creature-world --version)"
              ldd /bin/creature-world
              cp /etc/creature/world.json /tmp/world.json.before
              apt-get install --reinstall -y /artifacts/creature-world_*_$(dpkg --print-architecture).deb
              cmp /tmp/world.json.before /etc/creature/world.json
              apt-get remove -y creature-world
              test -f /etc/creature/world.json
            '

      - name: Inspect creature-communicator-gateway package
        run: |
          package="$(find artifacts -name 'creature-communicator-gateway_*_${{ matrix.arch }}.deb' -print -quit)"
          test -n "${package}"
          dpkg-deb --info "${package}"
          dpkg-deb --contents "${package}"
          dpkg-deb --contents "${package}" | grep -Eq ' ./bin/creature-communicator-gateway$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./etc/creature/communicator-gateway.json$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./usr/lib/systemd/system/creature-communicator-gateway.service$'

      - name: Smoke-test creature-communicator-gateway package in Debian Trixie
        run: |
          docker run --rm \
            --env DEBIAN_FRONTEND=noninteractive \
            --volume "${PWD}/artifacts:/artifacts:ro" \
            debian:trixie-slim \
            bash -euxc '
              apt-get update
              apt-get install -y /artifacts/creature-communicator-gateway_*_$(dpkg --print-architecture).deb
              test "$(stat -c %U:%G /bin/creature-communicator-gateway)" = root:root
              test "$(stat -c %a /bin/creature-communicator-gateway)" = 755
              test -f /etc/creature/communicator-gateway.json
              test -f /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -Fx "ExecStart=/bin/creature-communicator-gateway --config /etc/creature/communicator-gateway.json" /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -Fx "After=network-online.target creature-world.service" /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -Fx "DynamicUser=yes" /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -Fx "Restart=on-failure" /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -Fx "TimeoutStopSec=15" /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -F "\"port\": 8002" /etc/creature/communicator-gateway.json
              grep -F "\"world_url\": \"http://127.0.0.1:8001/world/v1\"" /etc/creature/communicator-gateway.json
              /bin/creature-communicator-gateway --version
              /bin/creature-communicator-gateway --help >/dev/null
              test "$(dpkg-query -W creature-communicator-gateway | cut -f2)" = "$(/bin/creature-communicator-gateway --version)"
              ldd /bin/creature-communicator-gateway
              cp /etc/creature/communicator-gateway.json /tmp/communicator-gateway.json.before
              apt-get install --reinstall -y /artifacts/creature-communicator-gateway_*_$(dpkg --print-architecture).deb
              cmp /tmp/communicator-gateway.json.before /etc/creature/communicator-gateway.json
              apt-get remove -y creature-communicator-gateway
              test -f /etc/creature/communicator-gateway.json
            '

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: creature-packages-${{ matrix.arch }}
          path: |
            artifacts/*.deb
            artifacts/*.ddeb
          # 7-day retention so build artifacts don't pile up against the
          # account-level Actions storage quota. Long enough to grab a
          # .deb off a recent commit; older commits should be rebuilt.
          retention-days: 7
