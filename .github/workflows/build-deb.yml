name: Build Debian Packages

on:
  push:
    branches:
      # "**" and not "*": a single star doesn't cross "/", which silently skipped
      # every feature/<n>-name branch this repo actually uses.
      - "**"

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Keep in step with Dockerfile.debian's default. A minor version floats to its newest
      # patch release, resolved from swift.org when the image is built.
      SWIFT_VERSION: "6.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Packages are built on Debian, never on Ubuntu (fleet packaging policy): the runner only
      # hosts Docker. The image and the build recipe are the ones build_debs.sh uses locally.
      - name: Build the Debian trixie build image
        run: |
          docker build --build-arg "SWIFT_VERSION=${SWIFT_VERSION}" \
            -t creature-deb-build -f Dockerfile.debian .

      - name: Build Debian packages
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v "${PWD}:/build/creature-console" \
            -v "${PWD}/artifacts:/out" \
            creature-deb-build \
            /build/creature-console/scripts/dpkg-build-in-container.sh /build/creature-console /out
          ls -l artifacts

      - name: Check package layout
        run: scripts/check_package_layout.sh artifacts ${{ matrix.arch }}

      - name: lintian report (report-only)
        run: |
          scripts/report_lintian.sh artifacts lintian-summary.txt
          . ./lintian-summary.txt
          if [ "${errors}" -gt 0 ] || [ "${warnings}" -gt 0 ]; then
            echo "::warning::lintian: ${errors} error(s), ${warnings} warning(s); see this step's log. Report-only: no tag fails the build yet."
          fi

      - name: Inspect creature-world package
        run: |
          package="$(find artifacts -name 'creature-world_*_${{ matrix.arch }}.deb' -print -quit)"
          test -n "${package}"
          dpkg-deb --info "${package}"
          dpkg-deb --contents "${package}"
          dpkg-deb --contents "${package}" | grep -Eq ' ./usr/bin/creature-world$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./etc/creature/world.json$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./usr/lib/systemd/system/creature-world.service$'

      - name: Smoke-test creature-world package in Debian Trixie
        run: |
          docker run --rm \
            --env DEBIAN_FRONTEND=noninteractive \
            --volume "${PWD}/artifacts:/artifacts:ro" \
            debian:trixie-slim \
            bash -euxc '
              apt-get update
              apt-get install -y /artifacts/creature-world_*_$(dpkg --print-architecture).deb
              test "$(stat -c %U:%G /usr/bin/creature-world)" = root:root
              test "$(stat -c %a /usr/bin/creature-world)" = 755
              test -f /etc/creature/world.json
              test -f /usr/lib/systemd/system/creature-world.service
              grep -Fx "ExecStart=/usr/bin/creature-world --config /etc/creature/world.json" /usr/lib/systemd/system/creature-world.service
              grep -Fx "DynamicUser=yes" /usr/lib/systemd/system/creature-world.service
              /usr/bin/creature-world --version
              /usr/bin/creature-world --help >/dev/null
              test "$(dpkg-query -W creature-world | cut -f2)" = "$(/usr/bin/creature-world --version)"
              ldd /usr/bin/creature-world
              cp /etc/creature/world.json /tmp/world.json.before
              apt-get install --reinstall -y /artifacts/creature-world_*_$(dpkg --print-architecture).deb
              cmp /tmp/world.json.before /etc/creature/world.json
              apt-get remove -y creature-world
              test -f /etc/creature/world.json
            '

      - name: Inspect creature-communicator-gateway package
        run: |
          package="$(find artifacts -name 'creature-communicator-gateway_*_${{ matrix.arch }}.deb' -print -quit)"
          test -n "${package}"
          dpkg-deb --info "${package}"
          dpkg-deb --contents "${package}"
          dpkg-deb --contents "${package}" | grep -Eq ' ./usr/bin/creature-communicator-gateway$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./etc/creature/communicator-gateway.json$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./usr/lib/systemd/system/creature-communicator-gateway.service$'

      - name: Inspect creature-body package
        run: |
          package="$(find artifacts -name 'creature-body_*_${{ matrix.arch }}.deb' -print -quit)"
          test -n "${package}"
          dpkg-deb --info "${package}"
          dpkg-deb --contents "${package}" | grep -Eq ' ./usr/bin/creature-body$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./etc/creature/body.json$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./etc/default/creature-body$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./usr/lib/systemd/system/creature-body.service$'

      - name: Inspect creature-house package
        run: |
          package="$(find artifacts -name 'creature-house_*_${{ matrix.arch }}.deb' -print -quit)"
          test -n "${package}"
          dpkg-deb --info "${package}"
          dpkg-deb --contents "${package}" | grep -Eq ' ./usr/bin/creature-house$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./etc/creature/house.json$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./etc/default/creature-house$'
          dpkg-deb --contents "${package}" | grep -Eq ' ./usr/lib/systemd/system/creature-house.service$'

      - name: Smoke-test creature-communicator-gateway package in Debian Trixie
        run: |
          docker run --rm \
            --env DEBIAN_FRONTEND=noninteractive \
            --volume "${PWD}/artifacts:/artifacts:ro" \
            debian:trixie-slim \
            bash -euxc '
              apt-get update
              apt-get install -y /artifacts/creature-communicator-gateway_*_$(dpkg --print-architecture).deb
              test "$(stat -c %U:%G /usr/bin/creature-communicator-gateway)" = root:root
              test "$(stat -c %a /usr/bin/creature-communicator-gateway)" = 755
              test -f /etc/creature/communicator-gateway.json
              test -f /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -Fx "ExecStart=/usr/bin/creature-communicator-gateway --config /etc/creature/communicator-gateway.json" /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -Fx "After=network-online.target creature-world.service" /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -Fx "DynamicUser=yes" /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -Fx "Restart=on-failure" /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -Fx "TimeoutStopSec=15" /usr/lib/systemd/system/creature-communicator-gateway.service
              grep -F "\"port\": 8002" /etc/creature/communicator-gateway.json
              grep -F "\"world_url\": \"http://127.0.0.1:8001/world/v1\"" /etc/creature/communicator-gateway.json
              /usr/bin/creature-communicator-gateway --version
              /usr/bin/creature-communicator-gateway --help >/dev/null
              test "$(dpkg-query -W creature-communicator-gateway | cut -f2)" = "$(/usr/bin/creature-communicator-gateway --version)"
              ldd /usr/bin/creature-communicator-gateway
              cp /etc/creature/communicator-gateway.json /tmp/communicator-gateway.json.before
              apt-get install --reinstall -y /artifacts/creature-communicator-gateway_*_$(dpkg --print-architecture).deb
              cmp /tmp/communicator-gateway.json.before /etc/creature/communicator-gateway.json
              apt-get remove -y creature-communicator-gateway
              test -f /etc/creature/communicator-gateway.json
            '

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: creature-packages-${{ matrix.arch }}
          # Built on Debian, the debug symbols are -dbgsym .deb files (Ubuntu makes .ddeb).
          path: artifacts/*.deb
          # 7-day retention so build artifacts don't pile up against the
          # account-level Actions storage quota. Long enough to grab a
          # .deb off a recent commit; older commits should be rebuilt.
          retention-days: 7
